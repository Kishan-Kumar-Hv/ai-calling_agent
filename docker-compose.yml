version: "3.9"

services:
  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    env_file: .env
    ports:
      - "3000:3000"

  voice-pipeline:
    build:
      context: .
      dockerfile: apps/voice-pipeline/Dockerfile
    env_file: .env
    ports:
      - "8080:8080"

  call-orchestrator:
    build:
      context: .
      dockerfile: apps/call-orchestrator/Dockerfile
    env_file: .env
    ports:
      - "4000:4000"

  crm-sync:
    build:
      context: .
      dockerfile: apps/crm-sync/Dockerfile
    env_file: .env
    ports:
      - "8081:8081"
